[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentai-local"
version = "0.1.0"
description = "Local OpenCode agent launcher with Gwarden support"
requires-python = ">=3.9"

[project.scripts]
agentai = "agentai.cli:main"

[tool.setuptools.packages.find]
include = ["agentai*"]
